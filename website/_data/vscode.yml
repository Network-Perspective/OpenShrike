headline: "VS Code extension"
lead: "Bring the security-first, self-hosted code reviewer into your editor. Run a scan from the sidebar, browse findings with evidence and remediation, and fix them with an agent — all against the LLM provider of your choice, with your code never leaving your machine."
image: "/assets/images/vscode.png"
image_alt: "OpenShrike VS Code extension"
marketplace: "https://marketplace.visualstudio.com/items?itemName=NetworkPerspective.openshrike"
